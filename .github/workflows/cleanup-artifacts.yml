name: Cleanup old artifacts

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete artifacts older than 7 days
    runs-on: ubuntu-latest

    steps:
      - name: Delete stale artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - (7 * 24 * 60 * 60 * 1000);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const artifacts = [];
            let page = 1;

            while (true) {
              const response = await github.rest.actions.listArtifactsForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });

              const items = response.data.artifacts || [];
              artifacts.push(...items);

              if (items.length < 100) break;
              page += 1;
            }

            for (const artifact of artifacts) {
              const createdAt = new Date(artifact.created_at).getTime();
              if (createdAt < cutoff) {
                console.log(`Deleting artifact ${artifact.name} (${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              }
            }
