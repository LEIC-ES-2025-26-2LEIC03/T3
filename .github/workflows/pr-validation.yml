name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
          requireScope: false

  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          # Allow: feature/xxx, fix/xxx, hotfix/xxx, chore/xxx, docs/xxx
          if [[ ! "$BRANCH" =~ ^(feature|fix|hotfix|chore|docs|test|ci)/.+ ]]; then
            echo "❌ Branch name '$BRANCH' does not follow the convention."
            echo "   Expected: feature/*, fix/*, hotfix/*, chore/*, docs/*"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH' is valid."

  check-changelog:
    name: Check CHANGELOG.md Updated
    runs-on: ubuntu-latest
    # Only enforce on PRs into main (releases)
    if: github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md was modified
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if echo "$CHANGED" | grep -q "CHANGELOG.md"; then
            echo "✅ CHANGELOG.md was updated."
          else
            echo "❌ PRs to main must update CHANGELOG.md."
            echo "   Document what changed in this release."
            exit 1
          fi
